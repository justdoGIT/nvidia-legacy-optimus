# /etc/modprobe.d/nvidia-drm-modeset.conf
#
# Enables kernel modesetting for nvidia_drm.
#
# WHY THIS IS NEEDED:
# Without modeset=1, nvidia_drm does not register a DRM/KMS node, which
# means Xorg cannot use the NVIDIA GPU as an xrandr provider for PRIME.
# Also required for Wayland compositors (though 390.xx has no Wayland support).
#
# WHY BOTH THIS FILE AND THE GRUB CMDLINE PARAMETER:
# nvidia_drm.ko loads during initramfs — before the rootfs (and this file)
# is mounted. The GRUB parameter (nvidia-drm.modeset=1) handles early boot.
# This file handles cases where the module is loaded post-rootfs (modprobe,
# manual load, or after update-initramfs bakes it in).
# Together they guarantee modeset=1 regardless of load order.
#
# VERIFY AFTER REBOOT:
#   cat /sys/module/nvidia_drm/parameters/modeset   # should return Y
#
# NOTE: In a pure Bumblebee setup, nvidia_drm may not be present at all
# (/sys/module/nvidia_drm may not exist). This is normal — Bumblebee drives
# NVIDIA directly via its own headless Xorg without the DRM layer.

options nvidia-drm modeset=1


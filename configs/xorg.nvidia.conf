# /etc/bumblebee/xorg.nvidia.conf
# Headless Xorg config for NVIDIA dGPU under Bumblebee
# Hardware: NVIDIA GF117 / GK208 (GT 610M - GT 820M range)
#
# This Xorg instance runs on display :8 (never visible to user).
# It has NO physical display output — Bumblebee renders frames here
# and Primus copies them to the Intel framebuffer.
#
# BusID: verify with: lspci | grep -i "3D\|VGA" | grep -i nvidia
# Format is PCI:bus:device:function (decimal, not hex)
# Example: "01:00.0" in lspci → BusID "PCI:1:0:0"

Section "ServerLayout"
    Identifier  "Layout0"
    Option      "AutoAddDevices" "false"
    Option      "AutoAddGPU" "false"
EndSection

Section "Device"
    Identifier  "DiscreteNvidia"
    Driver      "nvidia"
    VendorName  "NVIDIA Corporation"

    # CHANGE THIS if your NVIDIA BusID differs
    # Run: lspci | grep -i nvidia
    BusID       "PCI:1:0:0"

    Option      "ProbeAllGpus" "false"
    Option      "NoLogo" "true"

    # Suppress EDID probing — no monitor is connected to NVIDIA
    Option      "UseEDID" "false"
    Option      "UseDisplayDevice" "none"
EndSection


# /etc/bumblebee/bumblebee.conf
# Bumblebee configuration for NVIDIA 390.xx legacy driver (.run install)
# Hardware: Intel iGPU (i915) + NVIDIA Optimus dGPU (GF117/GK series)
#
# Key difference from default config:
# - XorgModulePath prepends /usr/lib/nvidia-bumblebee so the headless Xorg
#   finds NVIDIA's libglx.so BEFORE Mesa's in /usr/lib/xorg/modules/extensions
# - LibraryPath points to .run install locations (not apt package paths)

[bumblebeed]
VirtualDisplay=:8
KeepUnusedXServer=false
ServerGroup=bumblebee
TurnCardOffAtExit=false
NoEcoModeOverride=false
Driver=nvidia
XorgConfFile=/etc/bumblebee/xorg.conf.nvidia

[optirun]
Bridge=primus
VGLTransport=proxy
PrimusLibraryPath=/usr/lib/x86_64-linux-gnu/primus:/usr/lib/i386-linux-gnu/primus
AllowFallbackToIGC=false

[driver-nvidia]
KernelDriver=nvidia
PMMethod=bbswitch
LibraryPath=/usr/lib/x86_64-linux-gnu:/usr/lib/i386-linux-gnu
# CRITICAL: /usr/lib/nvidia-bumblebee must come FIRST
# It contains libglx.so -> libglx.so.390.157 (NVIDIA GLX)
# Without this, headless Xorg loads Mesa's libglx and NVIDIA init fails
XorgModulePath=/usr/lib/nvidia-bumblebee,/usr/lib/xorg/modules/drivers,/usr/lib/xorg/modules
XorgConfFile=/etc/bumblebee/xorg.conf.nvidia

[driver-nouveau]
KernelDriver=nouveau
PMMethod=auto
XorgConfFile=/etc/bumblebee/xorg.conf.nouveau

